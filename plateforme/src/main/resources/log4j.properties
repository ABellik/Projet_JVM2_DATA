# Définit le niveau par défaut à WARN (cache les INFO et DEBUG)
log4j.rootLogger=WARN, stdout

# Redirige les logs vers la console
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# --- Réglages spécifiques pour tes librairies ---

# Kafka : On veut voir les erreurs, mais pas chaque connexion/heartbeat
log4j.logger.org.apache.kafka=WARN
log4j.logger.io.confluent=WARN

# Hibernate : On cache les infos de démarrage et les requêtes SQL (sauf si tu veux les voir)
log4j.logger.org.hibernate=WARN
# Mets à DEBUG ou INFO si tu veux voir tes requêtes SQL générées
log4j.logger.org.hibernate.SQL=WARN 

# Zookeeper (souvent utilisé par Kafka)
log4j.logger.org.apache.zookeeper=WARN