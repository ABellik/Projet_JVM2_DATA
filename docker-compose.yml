
version: '3.8'

services:
  # ==========================================
  # KAFKA
  # ==========================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    hostname: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    #Ce qui est dans commande est équivalent à écrire ça dans le bash :
    #kafka-topics --create --topic evaluations --partitions 3 --replication-factor 1 --bootstrap-server localhost:9092


    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema-registry
    hostname: schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  # Interface Web pour Kafka (TRÈS utile pour débugger)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
      - schema-registry
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

  # ==========================================
  # BASES DE DONNEES
  # ==========================================

  postgres-editeur:
    image: postgres:15
    container_name: postgres-editeur
    hostname: postgres-editeur
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: editeur_db
      POSTGRES_USER: editeur
      POSTGRES_PASSWORD: editeur123
    volumes:
      - ./scripts/sql/schema-db-editeur.sql:/docker-entrypoint-initdb.d/init.sql


  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8085:8080"


  postgres-plateforme:
    image: postgres:15
    container_name: postgres-plateforme
    hostname: postgres-plateforme
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: plateforme_db
      POSTGRES_USER: plateforme
      POSTGRES_PASSWORD: plateforme123
    #volumes:
    #  - plateforme-data:/var/lib/postgresql/data
    #  - ../schema-db.sql:/docker-entrypoint-initdb.d/init.sql

  postgres-joueur:
    image: postgres:15
    container_name: postgres-joueur
    hostname: postgres-joueur
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: joueur_db
      POSTGRES_USER: joueur
      POSTGRES_PASSWORD: joueur123
    #volumes:
    #  - plateforme-data:/var/lib/postgresql/data
    #  - ./scripts/sql/init-joueur.sql:/docker-entrypoint-initdb.d/init.sql

  # Interface Web pour PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@projet.com
      PGADMIN_DEFAULT_PASSWORD: admin




#volumes:
#  editeur-data:
#  plateforme-data:
#  joueur-data:

# ==========================================
# COMMANDES UTILES
# ==========================================
# Démarrer tous les services : docker-compose up -d
# Arrêter tous les services : docker-compose down
# Voir les logs : docker-compose logs -f [dao]
# Redémarrer un dao : docker-compose restart [dao]
# Supprimer les volumes : docker-compose down -v
#
# INTERFACES WEB :
# - Kafka UI : http://localhost:8080
# - PgAdmin : http://localhost:5050
# - Schema Registry : http://localhost:8081
#
# CONNEXIONS BDD :
# - Éditeur : localhost:5432 / editeur / editeur123 / editeur_db
# - Plateforme : localhost:5433 / plateforme / plateforme123 / plateforme_db
# - Joueur : localhost:5434 / joueur / joueur123 / joueur_db
